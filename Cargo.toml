# Корневой файл рабочего пространства (workspace) Parodia.
# Здесь перечислены все модули (крейты) игры и общие версии библиотек,
# чтобы каждый модуль брал одну и ту же версию.

[workspace]
resolver = "3"
members = [
    "crates/parodia-core",
    "crates/parodia-world",
    "crates/parodia-mesh",
    "crates/parodia-render",
    "crates/parodia-ui",
    "crates/parodia-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
# Наши модули
parodia-core = { path = "crates/parodia-core" }
parodia-render = { path = "crates/parodia-render" }
parodia-world = { path = "crates/parodia-world" }
parodia-mesh = { path = "crates/parodia-mesh" }
parodia-ui = { path = "crates/parodia-ui" }

# Vulkan и окно. Версии подобраны совместимым набором (ash 0.38 = Vulkan 1.3.281).
ash = "0.38.0"
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
winit = "0.30.13"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }

# Отладочный интерфейс (только экран F3 и инструменты разработчика).
egui = "0.36.2"
egui-winit = "0.36.2"
egui-ash-renderer = { version = "0.13.0", default-features = false, features = ["gpu-allocator"] }

# Общие утилиты
log = "0.4"
anyhow = "1"
serde_json = "1"
glam = "0.33.12"
bytemuck = { version = "1.25", features = ["derive"] }

# Отладочная сборка: наш код с лёгкой оптимизацией (быстро собирается),
# сторонние библиотеки — с полной (иначе Vulkan и egui тормозят).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Финальная сборка: максимальная скорость.
[profile.release]
lto = "thin"
codegen-units = 1
